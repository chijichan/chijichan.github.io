<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChijiChat - 聊天室</title>
    <!-- Supabase JS SDK -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        /* ========== Reset & Base ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #18181b;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f4f4f5;
        }

        /* ========== Container ========== */
        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 100vh;
            max-height: 900px;
            background: #18181b;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin: 20px;
            border: 1px solid #27272a;
            position: relative;
        }

        /* ========== Header ========== */
        .chat-header {
            background: #18181b;
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #27272a;
            flex-shrink: 0;
        }

        .chat-header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #f4f4f5;
            letter-spacing: -0.02em;
        }

        .chat-header .online-count {
            font-size: 12px;
            color: #a1a1aa;
            background: #27272a;
            padding: 4px 12px;
            border-radius: 100px;
        }

        .chat-header .online-count span {
            color: #22c55e;
            font-weight: 600;
        }

        /* ========== Messages Area ========== */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #18181b;
        }

        .messages::-webkit-scrollbar {
            width: 4px;
        }

        .messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 100px;
        }

        /* ========== Message Bubbles ========== */
        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }

        .message.self {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message.other {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message.system {
            align-self: center;
            align-items: center;
            max-width: 90%;
        }

        @media (prefers-reduced-motion: no-preference) {
            .message {
                animation: fadeIn 0.3s ease;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(8px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        }

        .message .sender {
            font-size: 11px;
            color: #a1a1aa;
            margin-bottom: 3px;
            font-weight: 500;
            padding: 0 4px;
        }

        .message.self .sender {
            color: #22c55e;
        }

        .message .bubble {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
            position: relative;
        }

        .message.self .bubble {
            background: #22c55e;
            color: #09090b;
            border-bottom-right-radius: 4px;
        }

        .message.other .bubble {
            background: #27272a;
            color: #f4f4f5;
            border-bottom-left-radius: 4px;
        }

        .message.system .bubble {
            background: rgba(34, 197, 94, 0.08);
            color: #a1a1aa;
            font-size: 12px;
            padding: 5px 14px;
            border-radius: 100px;
            border: 1px solid rgba(34, 197, 94, 0.15);
        }

        .message .bubble .time {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.45);
            margin-top: 4px;
            text-align: right;
        }

        .message.self .bubble .time {
            color: rgba(9, 9, 11, 0.5);
        }

        .message.other .bubble .time {
            color: rgba(255, 255, 255, 0.3);
        }

        /* ========== Connection Status ========== */
        .connection-status {
            text-align: center;
            padding: 5px;
            font-size: 11px;
            flex-shrink: 0;
            transition: background 0.3s, color 0.3s;
        }

        .connection-status.connected {
            background: rgba(34, 197, 94, 0.08);
            color: #22c55e;
        }

        .connection-status.disconnected {
            background: rgba(239, 68, 68, 0.08);
            color: #ef4444;
        }

        .connection-status.connecting {
            background: rgba(234, 179, 8, 0.08);
            color: #eab308;
        }

        /* ========== Input Area ========== */
        .input-area {
            padding: 14px 20px 16px;
            background: #18181b;
            border-top: 1px solid #27272a;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
        }

        .input-area input[type="text"] {
            flex: 1;
            padding: 11px 16px;
            border: 1px solid #3f3f46;
            border-radius: 12px;
            background: #27272a;
            color: #f4f4f5;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-area input[type="text"]:focus {
            border-color: #22c55e;
        }

        .input-area input[type="text"]::placeholder {
            color: #52525b;
        }

        .input-area button {
            background: #22c55e;
            color: #09090b;
            border: none;
            border-radius: 12px;
            min-width: 46px;
            height: 40px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.12s, box-shadow 0.12s, background 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .input-area button:hover {
            background: #16a34a;
            transform: scale(1.03);
        }

        .input-area button:active {
            transform: scale(0.96);
        }

        .input-area button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            background: #3f3f46;
            color: #a1a1aa;
        }

        /* ========== Login Overlay ========== */
        .login-overlay {
            position: absolute;
            inset: 0;
            background: rgba(24, 24, 27, 0.96);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 16px;
        }

        .login-box {
            background: #18181b;
            padding: 36px;
            border-radius: 16px;
            border: 1px solid #27272a;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 360px;
            text-align: center;
        }

        .login-box h2 {
            font-size: 22px;
            font-weight: 600;
            color: #f4f4f5;
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }

        .login-box p {
            color: #a1a1aa;
            margin-bottom: 24px;
            font-size: 13px;
        }

        .login-box input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #3f3f46;
            border-radius: 12px;
            background: #27272a;
            color: #f4f4f5;
            font-size: 15px;
            outline: none;
            margin-bottom: 14px;
            transition: border-color 0.2s;
        }

        .login-box input:focus {
            border-color: #22c55e;
        }

        .login-box .login-btn {
            width: 100%;
            padding: 12px;
            background: #22c55e;
            color: #09090b;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.12s, background 0.15s;
        }

        .login-box .login-btn:hover {
            background: #16a34a;
            transform: translateY(-1px);
        }

        .login-box .login-btn:active {
            transform: translateY(0) scale(0.98);
        }

        /* ========== Empty State ========== */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            color: #52525b;
            text-align: center;
            padding: 40px 20px;
            gap: 8px;
        }

        .empty-state .empty-icon {
            font-size: 32px;
            margin-bottom: 4px;
            opacity: 0.5;
        }

        .empty-state .empty-title {
            font-size: 15px;
            font-weight: 500;
            color: #a1a1aa;
        }

        .empty-state .empty-desc {
            font-size: 13px;
            color: #52525b;
            max-width: 240px;
        }

        /* ========== Reduced Motion ========== */
        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ========== Responsive ========== */
        @media (max-width: 600px) {
            .chat-container {
                margin: 0;
                border-radius: 0;
                max-height: 100vh;
                height: 100vh;
            }

            .login-overlay {
                border-radius: 0;
            }

            .chat-header {
                padding: 14px 16px;
            }

            .messages {
                padding: 14px;
            }

            .input-area {
                padding: 12px 16px 14px;
            }

            .message {
                max-width: 88%;
            }
        }
    </style>
</head>

<body>

    <div class="chat-container" id="app">
        <!-- Login Overlay -->
        <div class="login-overlay" id="loginOverlay">
            <div class="login-box">
                <h2>ChijiChat</h2>
                <p>输入昵称加入聊天室</p>
                <input type="text" id="usernameInput" placeholder="你的昵称..." maxlength="20" autofocus />
                <button class="login-btn" id="loginBtn">进入聊天室</button>
            </div>
        </div>

        <!-- Header -->
        <div class="chat-header">
            <h1>ChijiChat</h1>
            <div class="online-count">在线: <span id="onlineCount">0</span></div>
        </div>

        <!-- Connection Status -->
        <div class="connection-status connecting" id="connectionStatus">连接中...</div>

        <!-- Messages -->
        <div class="messages" id="messages">
            <div class="empty-state" id="emptyState">
                <div class="empty-icon">~</div>
                <div class="empty-title">还没有消息</div>
                <div class="empty-desc">输入昵称加入聊天室，开始聊天吧</div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="输入消息..." disabled />
            <button id="sendBtn" disabled>发送</button>
        </div>
    </div>

    <script>
        // ====================================================================
        // ChijiChat - Supabase 纯静态聊天室
        // 1. 在 https://supabase.com 创建项目
        // 2. 在 SQL Editor 运行下方 SQL
        // 3. 替换 SUPABASE_URL 和 SUPABASE_ANON_KEY
        // ====================================================================

        // ========== Supabase 配置 ==========
        const SUPABASE_URL = 'https://vmhgtscgmidoctmagyup.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_XoICZcNrmikaX2QQemfGHg_ECdSh38n';

        // ========== 初始化 Supabase ==========
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            realtime: { params: { eventsPerSecond: 10 } },
        });

        // ========== State ==========
        let username = '';
        let isSubscribed = false;
        let presenceChannel = null;

        // ========== DOM ==========
        const loginOverlay = document.getElementById('loginOverlay');
        const usernameInput = document.getElementById('usernameInput');
        const loginBtn = document.getElementById('loginBtn');
        const messagesEl = document.getElementById('messages');
        const emptyState = document.getElementById('emptyState');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const onlineCount = document.getElementById('onlineCount');
        const connectionStatus = document.getElementById('connectionStatus');

        // ========== Login ==========
        loginBtn.addEventListener('click', enterChat);
        usernameInput.addEventListener('keydown', e => { if (e.key === 'Enter') enterChat(); });

        function enterChat() {
            const name = usernameInput.value.trim();
            if (!name) return;
            username = name;
            loginOverlay.style.display = 'none';
            initChat();
        }

        // ========== 初始化聊天 ==========
        async function initChat() {
            setStatus('connecting', '连接中...');
            await loadHistory();
            subscribeMessages();
            setupPresence();
            setStatus('connected', '已连接');
            messageInput.disabled = false;
            sendBtn.disabled = false;
            messageInput.focus();
        }

        // ========== 加载历史消息 ==========
        async function loadHistory() {
            try {
                const { data, error } = await supabaseClient
                    .from('messages')
                    .select('*')
                    .order('created_at', { ascending: true })
                    .limit(100);

                if (error) {
                    console.error('加载历史消息失败:', error);
                    appendSystemMessage('无法加载消息历史: ' + error.message);
                    return;
                }

                if (data && data.length > 0) {
                    if (emptyState) emptyState.style.display = 'none';
                    data.forEach(msg => {
                        if (msg.type === 'system') {
                            appendSystemMessage(msg.text);
                        } else {
                            appendMessage(msg.username, msg.text, msg.created_at, msg.username === username);
                        }
                    });
                    scrollToBottom();
                }
            } catch (err) {
                console.error('加载历史消息异常:', err);
                appendSystemMessage('无法连接数据库，请检查 Supabase 配置');
            }
        }

        // ========== 订阅实时消息 ==========
        function subscribeMessages() {
            if (isSubscribed) return;
            isSubscribed = true;

            supabaseClient
                .channel('messages-channel')
                .on('postgres_changes',
                    { event: 'INSERT', schema: 'public', table: 'messages' },
                    (payload) => {
                        const msg = payload.new;
                        if (emptyState) emptyState.style.display = 'none';
                        if (msg.type === 'system') {
                            appendSystemMessage(msg.text);
                        } else {
                            appendMessage(msg.username, msg.text, msg.created_at, msg.username === username);
                        }
                    }
                )
                .subscribe((status) => {
                    if (status === 'SUBSCRIBED') {
                        console.log('已订阅消息频道');
                    } else if (status === 'CHANNEL_ERROR') {
                        setStatus('disconnected', '实时连接失败');
                    }
                });
        }

        // ========== 在线状态 ==========
        function setupPresence() {
            presenceChannel = supabaseClient.channel('presence-channel', {
                config: { presence: { key: username } },
            });

            presenceChannel
                .on('presence', { event: 'sync' }, () => {
                    const state = presenceChannel.presenceState();
                    const count = Object.keys(state).length;
                    onlineCount.textContent = count;
                })
                .on('presence', { event: 'join' }, ({ key }) => {
                    if (key === username) return;
                    appendSystemMessage(key + ' 加入了聊天室');
                })
                .on('presence', { event: 'leave' }, ({ key }) => {
                    appendSystemMessage(key + ' 离开了聊天室');
                })
                .subscribe(async (status) => {
                    if (status === 'SUBSCRIBED') {
                        await presenceChannel.track({
                            online_at: new Date().toISOString(),
                            username: username,
                        });
                    }
                });
        }

        // ========== 发送消息 ==========
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') sendMessage();
        });

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || text.length > 500) return;

            try {
                const { error } = await supabaseClient
                    .from('messages')
                    .insert({ username: username, text: text, type: 'chat' });

                if (error) {
                    console.error('发送消息失败:', error);
                    appendSystemMessage('发送失败: ' + error.message);
                    return;
                }

                // 立即本地追加消息，确保自己立即看到
                if (emptyState) emptyState.style.display = 'none';
                appendMessage(username, text, new Date().toISOString(), true);
                messageInput.value = '';
                messageInput.focus();
            } catch (err) {
                console.error('发送消息异常:', err);
                appendSystemMessage('发送失败，请检查网络');
            }
        }

        // ========== UI 辅助函数 ==========
        function setStatus(type, text) {
            connectionStatus.className = 'connection-status ' + type;
            connectionStatus.textContent = text;
        }

        function appendMessage(sender, text, time, isSelf) {
            const div = document.createElement('div');
            div.className = 'message ' + (isSelf ? 'self' : 'other');
            const timeStr = time
                ? new Date(time).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
                : '';
            div.innerHTML =
                '<div class="sender">' + escapeHtml(sender) + '</div>' +
                '<div class="bubble">' +
                escapeHtml(text) +
                '<div class="time">' + timeStr + '</div>' +
                '</div>';
            messagesEl.appendChild(div);
            scrollToBottom();
        }

        function appendSystemMessage(text) {
            const div = document.createElement('div');
            div.className = 'message system';
            div.innerHTML = '<div class="bubble">' + escapeHtml(text) + '</div>';
            messagesEl.appendChild(div);
            scrollToBottom();
        }

        function scrollToBottom() {
            requestAnimationFrame(() => {
                messagesEl.scrollTop = messagesEl.scrollHeight;
            });
        }

        function escapeHtml(str) {
            var d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        // ====================================================================
        // Supabase 数据库设置 - 在 SQL Editor 运行:
        // ====================================================================
        /*
        CREATE TABLE messages (
            id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
            created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            username TEXT NOT NULL,
            text TEXT NOT NULL,
            type TEXT NOT NULL DEFAULT 'chat'
        );
        ALTER TABLE messages ENABLE ROW LEVEL SECURITY;
        CREATE POLICY "允许所有人读取消息" ON messages FOR SELECT USING (true);
        CREATE POLICY "允许所有人发送消息" ON messages FOR INSERT WITH CHECK (true);
        CREATE INDEX idx_messages_created_at ON messages (created_at);
        */
    </script>
</body>

</html>
