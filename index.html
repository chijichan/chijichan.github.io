<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChijiChat - AI 聊天</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div class="chat-container" id="app">

        <!-- 登录层 -->
        <div class="login-overlay" id="loginOverlay">
            <div class="login-box">
                <h2>ChijiChat</h2>
                <p>输入昵称开始 AI 对话</p>
                <input type="text" id="usernameInput" placeholder="你的昵称..." maxlength="20" autocomplete="off" />
                <button class="login-btn" id="loginBtn">开始聊天</button>
            </div>
        </div>

        <!-- 设置密码验证层 -->
        <div class="settings-lock-overlay" id="settingsLockOverlay">
            <div class="login-box">
                <h2>管理员验证</h2>
                <p>输入管理员密码以打开设置</p>
                <input type="password" id="settingsLockPwd" placeholder="管理员密码..." autocomplete="off" />
                <button class="login-btn" id="settingsLockBtn">解锁</button>
                <button class="login-btn ghost" id="settingsLockCancel">取消</button>
                <div class="settings-status" id="settingsLockStatus"></div>
            </div>
        </div>

        <!-- 设置面板 -->
        <div class="settings-overlay" id="settingsOverlay">
            <div class="settings-inner">
                <h2>AI 设置</h2>

                <div class="settings-group">
                    <label>API 地址</label>
                    <input type="text" id="settingsEndpoint" placeholder="https://api.openai.com/v1"
                        autocomplete="off" />
                    <div class="hint">兼容 OpenAI 格式的 API 端点</div>
                </div>

                <div class="settings-group">
                    <label>API Key</label>
                    <input type="password" id="settingsKey" placeholder="sk-..." autocomplete="off" />
                    <div class="hint">默认仅保存在此浏览器（localStorage），不会上传</div>
                </div>

                <div class="settings-group">
                    <label>模型</label>
                    <input type="text" id="settingsModel" placeholder="gpt-4o-mini" autocomplete="off" />
                    <div class="hint">模型名称，如 gpt-4o-mini, claude-3-haiku, deepseek-chat</div>
                </div>

                <div class="settings-group">
                    <label>系统提示词</label>
                    <textarea id="settingsPrompt" placeholder="你是一个有用的助手" rows="3"></textarea>
                    <div class="hint">AI 的角色设定</div>
                </div>

                <div class="settings-group checkbox-group">
                    <input type="checkbox" id="settingsSync" />
                    <label class="checkbox-label" for="settingsSync">
                        同步到聊天室（共享给所有访客使用）
                        <div class="hint" style="margin-top:4px;">注意：勾选后 API Key 将上传到公共数据库，所有人可见，请谨慎使用</div>
                    </label>
                </div>

                <div class="settings-actions">
                    <button class="save-btn" id="settingsSaveBtn">保存</button>
                    <button class="close-btn" id="settingsCloseBtn">取消</button>
                </div>

                <div class="settings-status" id="settingsStatus"></div>

                <!-- 管理员密码 -->
                <div class="settings-group" style="margin-top:24px; padding-top:20px; border-top:1px solid #27272a;">
                    <label>管理员密码</label>
                    <input type="password" id="adminPwdInput" placeholder="设置或修改管理员密码" autocomplete="off" />
                    <div class="hint">保存后，打开设置需要输入该密码验证。留空并点击"保存密码"可清除密码。</div>
                    <button class="admin-save-btn" id="adminPwdSaveBtn" style="margin-top:8px;">保存密码</button>
                </div>
            </div>
        </div>

        <!-- 顶栏 -->
        <div class="chat-header">
            <div class="chat-header-left">
                <h1>ChijiChat</h1>
                <span class="model-badge" id="modelBadge">未配置</span>
            </div>
            <div class="header-actions">
                <button id="clearBtn">清除对话</button>
                <button id="settingsBtn">设置</button>
            </div>
        </div>

        <!-- 连接状态 -->
        <div class="connection-status connecting" id="connectionStatus">连接中...</div>

        <!-- 消息区 -->
        <div class="messages" id="messages">
            <div class="empty-state" id="emptyState">
                <div class="empty-icon">~</div>
                <div class="empty-title">开始 AI 对话</div>
                <div class="empty-desc">发送一条消息，AI 会自动回复。先在设置中配置 API 地址和密钥。</div>
            </div>
        </div>

        <!-- 输入指示器 -->
        <div class="typing-indicator" id="typingIndicator">
            <div class="bubble">
                <span class="typing-pulse"></span>
                <span class="typing-text">AI 正在输入</span>
            </div>
        </div>

        <!-- 输入区 -->
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="给 AI 发送消息..." maxlength="2000" disabled
                autocomplete="off" />
            <button id="sendBtn" disabled>发送</button>
        </div>
    </div>

    <!-- Supabase JS SDK -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <!-- 应用逻辑 -->
    <script src="app.js"></script>
</body>

</html>
